<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boom Down! — Flowstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', 'Space Grotesk', sans-serif; }
    #stage { touch-action: none; }
  </style>
</head>
<body class="bg-sky-200 min-h-screen text-zinc-900">
  <div class="bg-orange-500 text-white py-2 px-4 flex items-center justify-between text-sm">
    <a href="build-apps.html" class="font-bold">← Build Apps</a>
    <span class="font-bold tracking-wide">BOOM DOWN!</span>
  </div>

  <div class="max-w-xl mx-auto p-4">
    <p class="text-center text-orange-700 font-bold mb-2">Pick a hero. Smash crates. Roar the letter.</p>
    <div id="heroes" class="grid grid-cols-4 gap-2 mb-3 text-center text-xs font-bold"></div>
    <canvas id="stage" class="w-full rounded-3xl bg-sky-300 shadow-xl border-4 border-orange-400" width="480" height="640"></canvas>
    <p id="hint" class="text-center mt-3 text-lg font-bold text-orange-800">Tap a crate!</p>
    <p class="text-center text-sm text-zinc-600 mt-2">Score <span id="sc">0</span> · Letters <span id="lets">0</span></p>
  </div>

<script>
const C = document.getElementById('stage');
const X = C.getContext('2d');
const W = 480, H = 640;
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const heroes = [
  { id: 'rex', name: 'Rex', color: '#22c55e', body: '#16a34a' },
  { id: 'liz', name: 'Liz', color: '#06b6d4', body: '#0891b2' },
  { id: 'truck', name: 'Truck', color: '#f97316', body: '#c2410c' },
  { id: 'ptero', name: 'Ptero', color: '#3b82f6', body: '#1d4ed8' }
];
let hero = heroes[0], score = 0, learned = 0, crates = [], boom = [], last = 0;

function speak(t) {
  try {
    const u = new SpeechSynthesisUtterance(t);
    u.rate = 0.9; u.pitch = 1.2;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

function spawn() {
  crates = [];
  const cols = 3, rows = 3, size = 88, gap = 18;
  const ox = (W - cols * size - (cols - 1) * gap) / 2;
  const oy = 160;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      crates.push({
        x: ox + c * (size + gap),
        y: oy + r * (size + gap),
        s: size,
        letter: letters[Math.floor(Math.random() * letters.length)],
        live: 1,
        shake: 0,
        hue: ['#f59e0b','#fb7185','#34d399','#60a5fa','#c084fc'][(r * cols + c) % 5]
      });
    }
  }
}

function reset() {
  score = 0; learned = 0; boom = []; spawn(); hud();
}

function hud() {
  document.getElementById('sc').textContent = score;
  document.getElementById('lets').textContent = learned;
}

function smash(cr) {
  if (!cr.live) return;
  cr.live = 0; cr.shake = 8;
  score += 10; learned += 1; hud();
  document.getElementById('hint').textContent = cr.letter + '!';
  speak(cr.letter);
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 180;
    boom.push({ x: cr.x + cr.s / 2, y: cr.y + cr.s / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, l: 0.45, c: cr.hue });
  }
  if (!crates.some(c => c.live)) setTimeout(spawn, 500);
}

function hit(mx, my) {
  const r = C.getBoundingClientRect();
  const x = (mx - r.left) * (W / r.width);
  const y = (my - r.top) * (H / r.height);
  for (let i = crates.length - 1; i >= 0; i--) {
    const cr = crates[i];
    if (cr.live && x > cr.x && x < cr.x + cr.s && y > cr.y && y < cr.y + cr.s) {
      smash(cr); return;
    }
  }
}

function drawHero() {
  X.save();
  X.translate(W / 2, 88);
  X.fillStyle = hero.body;
  X.beginPath(); X.ellipse(0, 10, 38, 28, 0, 0, 7); X.fill();
  X.fillStyle = hero.color;
  X.beginPath(); X.arc(0, -18, 22, 0, 7); X.fill();
  X.fillStyle = '#fff'; X.beginPath(); X.arc(-8, -20, 6, 0, 7); X.arc(8, -20, 6, 0, 7); X.fill();
  X.fillStyle = '#111'; X.beginPath(); X.arc(-8, -20, 3, 0, 7); X.arc(8, -20, 3, 0, 7); X.fill();
  X.restore();
  X.fillStyle = '#7c2d12';
  X.font = '700 22px Fredoka, sans-serif';
  X.textAlign = 'center';
  X.fillText(hero.name.toUpperCase() + ' IS READY', W / 2, 140);
}

function draw() {
  X.clearRect(0, 0, W, H);
  const g = X.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#86efac');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  X.fillStyle = '#4ade80'; X.fillRect(0, H - 70, W, 70);
  drawHero();
  crates.forEach(cr => {
    if (!cr.live && cr.shake <= 0) return;
    const j = cr.shake > 0 ? (Math.random() * 6 - 3) : 0;
    X.fillStyle = cr.hue;
    X.fillRect(cr.x + j, cr.y + j, cr.s, cr.s);
    X.strokeStyle = '#7c2d12'; X.lineWidth = 4; X.strokeRect(cr.x + j, cr.y + j, cr.s, cr.s);
    if (cr.live) {
      X.fillStyle = '#fff';
      X.font = '700 42px Fredoka, sans-serif';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(cr.letter, cr.x + cr.s / 2 + j, cr.y + cr.s / 2 + j);
    }
    cr.shake = Math.max(0, cr.shake - 1);
  });
  boom.forEach(p => {
    X.globalAlpha = Math.max(0, p.l / 0.45);
    X.fillStyle = p.c; X.fillRect(p.x, p.y, 8, 8);
    X.globalAlpha = 1;
  });
}

function upd(dt) {
  boom.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 280 * dt; p.l -= dt; });
  boom = boom.filter(p => p.l > 0);
}

function loop(t) {
  const d = Math.min(0.033, (t - (last || t)) / 1000); last = t;
  upd(d); draw(); requestAnimationFrame(loop);
}

function pills() {
  const box = document.getElementById('heroes');
  box.innerHTML = '';
  heroes.forEach(h => {
    const b = document.createElement('button');
    b.className = 'rounded-2xl py-2 px-1 text-white shadow ' + (h === hero ? 'ring-4 ring-yellow-300' : '');
    b.style.background = h.color;
    b.textContent = h.name;
    b.onclick = () => { hero = h; pills(); speak(h.name); };
    box.appendChild(b);
  });
}

C.addEventListener('pointerdown', e => { e.preventDefault(); hit(e.clientX, e.clientY); });
pills(); reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
