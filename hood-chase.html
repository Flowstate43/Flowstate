<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOOD CHASE</title><style>html,body{margin:0;height:100%;background:#07080c;color:#fff;font-family:sans-serif;overflow:hidden}#ui{position:fixed;left:0;right:0;top:0;padding:8px 12px;display:flex;justify-content:space-between;font:12px monospace;color:#00e676;z-index:2}canvas{display:block;margin:40px auto 0;background:#0a120e;max-width:100%;touch-action:none}#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:3}#ov.hid{display:none}.p{background:#0b120e;border:2px solid #00e676;border-radius:12px;padding:20px;width:min(360px,92vw);text-align:center}button{background:#00e676;border:0;padding:12px 16px;margin:6px;border-radius:8px;font-weight:700}table{width:100%;font:12px monospace;color:#c8e6c9}input{width:80px;text-align:center;padding:8px;background:#041108;color:#00e676;border:1px solid #00e676}</style></head><body><div id="ui"><span id="sc">SCORE 0</span><span id="hi">HI 0</span><span id="lv">LIVES 3</span></div><canvas id="c" width="480" height="640"></canvas><div id="ov"></div><script>const C=document.getElementById('c'),X=C.getContext('2d'),W=480,H=640,ov=document.getElementById('ov'),HS='hc_v2';let st='menu',sc=0,lv=3,wv=1,pl=null,bl=[],en=[],bm=[],pt=[],ky={},cd=0,dir=1,dtm=0,last=0,muted=0,ac=null;const T=[{l:'F',c:'#00e676',p:10},{l:'B',c:'#f7931a',p:20},{l:'E',c:'#8ea2ff',p:30},{l:'P',c:'#66bb6a',p:50}];function load(){try{return JSON.parse(localStorage.getItem(HS)||'[]')}catch(e){return[]}}function save(a){localStorage.setItem(HS,JSON.stringify(a.slice(0,10)))}function best(){const a=load();return a[0]?a[0].s:0}function add(n,s,w){const name=(n||'HOO').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3)||'HOO';const a=load();a.push({n:name,s:s,w:w,t:Date.now()});a.sort((x,y)=>y.s-x.s);save(a);return a}function tbl(){const a=load();if(!a.length)return '<p>No scores yet</p>';return '<table>'+a.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.n+'</td><td>'+r.s+'</td><td>W'+r.w+'</td></tr>').join('')+'</table>'}function beep(f,d,tp,v,sl){if(muted)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext);if(ac.state==='suspended')ac.resume();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=tp||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,sl),t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}function menu(){st='menu';ov.className='';ov.innerHTML='<div class="p"><h2>HOOD CHASE</h2><p>Shoot BTC ETH PEPE feathers.</p>'+tbl()+'<button id="go">START HEIST</button></div>'}function over(){st='over';beep(180,.3,'sawtooth',.1,60);ov.className='';const q=sc>0&&(load().length<10||sc>(load()[load().length-1]||{s:0}).s);ov.innerHTML='<div class="p"><h2>BAG DROPPED</h2><p>'+sc+' pts wave '+wv+'</p>'+(q?'<p>TAG <input id="tg" maxlength="3" value="HOO"> <button id="sv">SAVE</button></p>':tbl())+'<button id="go">RUN IT BACK</button></div>'}function spawn(){en=[];const rows=Math.min(5,3+Math.floor(wv/2)),cols=8,gx=48,gy=42,sx=(W-(cols-1)*gx)/2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)en.push({x:sx+c*gx,y:50+r*gy,w:28,h:28,t:T[(r+wv+c)%T.length],a:1});dir=1}function reset(){sc=0;lv=3;wv=1;bl=[];bm=[];pt=[];cd=0;dir=1;dtm=0;pl={x:W/2,y:H-52};spawn();hud()}function hud(){document.getElementById('sc').textContent='SCORE '+sc;document.getElementById('hi').textContent='HI '+Math.max(best(),sc);document.getElementById('lv').textContent='LIVES '+lv}function fire(){if(cd>0||st!=='play')return;bl.push({x:pl.x,y:pl.y-16,v:-420});cd=.22;beep(720,.07,'square',.05,280)}function boom(x,y,c){for(let i=0;i<10;i++){const a=Math.random()*6.28,s=40+Math.random()*140;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c})}}function upd(dt){if(st!=='play')return;cd=Math.max(0,cd-dt);if(ky.ArrowLeft||ky.a||ky.A)pl.x-=260*dt;if(ky.ArrowRight||ky.d||ky.D)pl.x+=260*dt;pl.x=Math.max(22,Math.min(W-22,pl.x));bl.forEach(b=>b.y+=b.v*dt);bl=bl.filter(b=>b.y>-20);const al=en.filter(e=>e.a);if(!al.length){wv++;beep(520,.12,'square',.06);spawn();hud();return}let edge=0;al.forEach(e=>{e.x+=dir*(28+wv*10)*dt;if(e.x<18||e.x>W-18)edge=1});if(edge){dir*=-1;al.forEach(e=>{e.y+=16})}dtm-=dt;if(dtm<=0&&al.length){dtm=Math.max(.35,1.15-wv*.08);const s=al[Math.floor(Math.random()*al.length)];bm.push({x:s.x,y:s.y+14,v:160+wv*18,c:s.t.c})}bm.forEach(b=>b.y+=b.v*dt);bm=bm.filter(b=>b.y<H+20);bl.forEach(b=>en.forEach(e=>{if(!e.a)return;if(Math.abs(b.x-e.x)<14&&Math.abs(b.y-e.y)<14){e.a=0;b.y=-999;sc+=e.t.p*wv;boom(e.x,e.y,e.t.c);beep(220,.1,'sawtooth',.07,80);hud()}}));bm.forEach(b=>{if(Math.abs(b.x-pl.x)<18&&Math.abs(b.y-pl.y)<16){b.y=H+99;lv--;boom(pl.x,pl.y,'#00e676');beep(140,.25,'sawtooth',.1,50);hud();if(lv<=0)over()}});if(al.some(e=>e.y>pl.y-28)){lv=0;over()}pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});pt=pt.filter(p=>p.l>0)}function draw(){X.clearRect(0,0,W,H);X.fillStyle='#fff2';for(let i=0;i<40;i++)X.fillRect((i*97)%W,(i*53+Date.now()*.01)%H,1,1);en.forEach(e=>{if(!e.a)return;X.fillStyle=e.t.c;X.beginPath();X.arc(e.x,e.y,14,0,7);X.fill();X.fillStyle='#041108';X.font='14px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(e.t.l,e.x,e.y)});bl.forEach(b=>{X.fillStyle='#ffd54f';X.fillRect(b.x-1.5,b.y,3,12)});bm.forEach(b=>{X.fillStyle=b.c;X.fillRect(b.x-2,b.y,4,10)});pt.forEach(p=>{X.globalAlpha=Math.max(0,p.l/.5);X.fillStyle=p.c;X.fillRect(p.x,p.y,3,3);X.globalAlpha=1});if(pl){X.fillStyle='#00e676';X.beginPath();X.moveTo(pl.x-16,pl.y+8);X.lineTo(pl.x,pl.y-16);X.lineTo(pl.x+16,pl.y+8);X.fill()}}function loop(t){const d=Math.min(.033,(t-(last||t))/1000);last=t;upd(d);draw();requestAnimationFrame(loop)}function go(){ov.className='hid';reset();st='play';beep(440,.1,'square',.06);hud()}ov.onclick=e=>{if(e.target.id==='go')go();if(e.target.id==='sv'){add((document.getElementById('tg')||{}).value,sc,wv);menu()}};window.onkeydown=e=>{ky[e.key]=1;if(e.key===' '){e.preventDefault();fire()}if(e.key==='Enter'&&st!=='play')go()};window.onkeyup=e=>ky[e.key]=0;let drag=0;C.onpointerdown=e=>{drag=1;const r=C.getBoundingClientRect();if(pl)pl.x=(e.clientX-r.left)*(W/r.width);fire()};C.onpointermove=e=>{if(!drag||!pl)return;const r=C.getBoundingClientRect();pl.x=Math.max(22,Math.min(W-22,(e.clientX-r.left)*(W/r.width)))};window.onpointerup=()=>drag=0;hud();menu();requestAnimationFrame(loop);</script></body></html>
