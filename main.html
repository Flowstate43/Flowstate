<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="bg-zinc-900 border-b border-zinc-700 py-3 px-4 md:px-6 flex items-center justify-between text-xs md:text-sm overflow-x-auto">
    <div id="tickers" class="flex gap-4 md:gap-6 font-mono whitespace-nowrap"></div>
    <div class="flex items-center gap-4 md:gap-8 flex-shrink-0">
      <div id="fear-greed" class="flex items-center gap-2"></div>
      <div id="signal" class="font-bold px-3 md:px-4 py-1 rounded-full text-xs md:text-sm"></div>
    </div>
  </div>

  <div class="p-4 md:p-8">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8 md:mb-12">
      <h1 class="text-4xl md:text-5xl font-bold">Flowstate</h1>
      <nav class="flex gap-4 md:gap-6 text-sm md:text-base text-zinc-400">
        <a href="news.html" class="text-cyan-400 font-bold hover:text-cyan-300">News</a>
        <span>On My Mind</span>
        <a href="apps-games.html" class="text-orange-400 font-bold hover:text-orange-300">APPS GAMES</a>
        <a href="log.html" class="text-amber-400 font-bold hover:text-amber-300">LoG</a>
      </nav>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
      <a href="news.html" class="p-6 md:p-8 rounded-3xl border-l-4 border-cyan-400 bg-zinc-900/50 hover:bg-zinc-900 block">
        <h3 class="text-xl md:text-2xl font-bold mb-4">News</h3>
        <p class="text-zinc-400">TECH. AI. Crypto.</p>
        <p class="text-cyan-400 text-sm mt-4 font-bold">Open desk →</p>
      </a>
      <div class="p-6 md:p-8 rounded-3xl border-l-4 border-purple-400 bg-zinc-900/50">
        <h3 class="text-xl md:text-2xl font-bold mb-4">On My Mind</h3>
        <p class="text-zinc-400">Thoughts and ideas...</p>
      </div>
      <a href="apps-games.html" class="p-6 md:p-8 rounded-3xl border-l-4 border-orange-400 bg-zinc-900/50 hover:bg-zinc-900 block">
        <h3 class="text-xl md:text-2xl font-bold mb-4">APPS GAMES</h3>
        <p class="text-zinc-400">Boom Down!</p>
        <p class="text-orange-300 text-sm mt-4 font-bold">Open →</p>
      </a>
    </div>

    <div class="mt-8">
      <a href="log.html" class="inline-block p-6 md:p-8 rounded-3xl border-l-4 border-amber-400 bg-zinc-900/50 hover:bg-zinc-900">
        <h3 class="text-xl md:text-2xl font-bold mb-2">LoG</h3>
        <p class="text-zinc-400">Everyday rants.</p>
      </a>
    </div>
  </div>

  <script>
    async function updateDashboard() {
      try {
        const prices = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true').then(r => r.json());
        let tickersHTML = '';
        Object.keys(prices).forEach(coin => {
          const p = prices[coin];
          const ch = p.usd_24h_change.toFixed(1);
          const color = ch > 0 ? 'text-emerald-400' : 'text-red-400';
          tickersHTML += `<span class="mr-3 md:mr-6">${coin.toUpperCase()} <span class="${color}">$${p.usd.toLocaleString()} (${ch}%)</span></span>`;
        });
        document.getElementById('tickers').innerHTML = tickersHTML;

        const fgData = await fetch('https://api.alternative.me/fng/?limit=1').then(r => r.json());
        const fg = parseInt(fgData.data[0].value);
        let fgColor = fg < 40 ? 'text-red-400' : 'text-emerald-400';
        document.getElementById('fear-greed').innerHTML = `Fear & Greed: <span class="${fgColor} font-bold">${fg}</span>`;

        const signalEl = document.getElementById('signal');
        if (fg < 40) {
          signalEl.innerHTML = "BUY THE DIP";
          signalEl.className = "font-bold px-3 md:px-5 py-1 md:py-2 rounded-xl border-2 border-emerald-400 bg-emerald-500/10 text-emerald-400 text-xs md:text-sm";
        } else {
          signalEl.innerHTML = "HOLD";
          signalEl.className = "font-bold px-3 md:px-5 py-1 md:py-2 rounded-xl border-2 border-yellow-400 bg-yellow-500/10 text-yellow-400 text-xs md:text-sm";
        }
      } catch(e) {
        console.log("API error");
      }
    }
    updateDashboard();
    setInterval(updateDashboard, 60000);
  </script>
</body>
</html>
