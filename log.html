<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoG — Flowstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'VT323', monospace; background: #0a0a0a; color: #00ff00; font-size: 1.25rem; }
    #scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9998; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px); }
    .app-header { border-bottom: 1px solid rgba(251,191,36,0.4); background: #050505; }
    article { border-left: 2px solid #fbbf24; padding-left: 1.25rem; }
    h1, h2 { color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.45); }
    p { color: #b6ffb6; line-height: 1.45; }
    time { color: rgba(251,191,36,0.6); }
    .status-bar { font-size: 0.95rem; color: rgba(251,191,36,0.5); border-top: 1px solid rgba(251,191,36,0.25); background: #030303; }
  </style>
</head>
<body class="min-h-screen">
  <div id="scanlines"></div>
  <div class="app-header py-2 px-4 flex items-center justify-between text-lg">
    <a href="main.html" style="color:#fbbf24">← MAIN</a>
    <span style="color:#fbbf24">LOG</span>
    <span class="opacity-40 text-sm">LOG TERMINAL</span>
  </div>
  <div class="max-w-3xl mx-auto p-4 md:p-8" style="padding-bottom:4rem">
    <h1 class="text-5xl font-bold mb-2">// LOG</h1>
    <p class="mb-10" style="color:rgba(251,191,36,0.55)">Everyday rants. No polish required.</p>
    <article class="mb-10">
      <time>AUG 30, 2026</time>
      <h2 class="text-3xl font-bold mt-1 mb-3">Day one</h2>
      <p>Replace this. Type the rant. That's the whole blog.</p>
    </article>
  </div>
  <div class="status-bar fixed bottom-0 left-0 right-0 py-1.5 px-4 flex justify-between">
    <span>FLOWSTATE://LOG/TERMINAL</span>
    <span id="clock"></span>
  </div>
  <script>
    function clock() {
      var n = new Date(), p = function(x) { return x.toString().padStart(2,'0'); };
      document.getElementById('clock').textContent = p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
    }
    clock(); setInterval(clock, 1000);
  </script>
</body>
</html>
